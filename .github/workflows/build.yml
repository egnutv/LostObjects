# Builds Lost Objects on every push and pull request.
#
# Where to find the result:
#   * releases/LostObjects-<version>.zip in the repository itself (updated after
#     every successful build of the main branch)
#   * Actions tab -> the latest run -> "Artifacts"
# A tag like "v0.1.0" additionally creates a GitHub release with the mod archive.

name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "releases/**"  # the build's own commit must not start another build
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to publish releases for tags

jobs:
  plugin-file:
    name: Check plugin file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Plugin file is up to date with the generator
        run: python tools/build_plugin.py --check

      - name: Plugin file is well formed
        run: python tools/verify_plugin.py

  icon-files:
    name: Check icon files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Textures are reproducible from Logo/Logo.png
        run: |
          pip install -r tools/icon/requirements.txt
          python tools/icon/make_icon_textures.py
          git diff --exit-code -- data/Textures

      - name: Mesh is reproducible from tools/icon/make_icon_nif.cpp
        run: |
          cmake -S tools/icon -B build/icon
          cmake --build build/icon
          build/icon/make_icon_nif data/Meshes/LostObjects/MenuIcon.nif
          git diff --exit-code -- data/Meshes

  build:
    name: Build DLL (Windows, Visual Studio 2026)
    needs: [plugin-file, icon-files]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - name: Install CMake and Ninja (latest)
        uses: lukka/get-cmake@latest

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 802d61d714db2714e3fefcfc59447431166b8367

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Compile the Papyrus scripts (settings holotape)
        shell: pwsh
        run: |
          cmake -S tools/papyrus -B build/papyrus -G "Visual Studio 18 2026" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md-release -DVCPKG_HOST_TRIPLET=x64-windows-static-md-release
          cmake --build build/papyrus --config Release
          Get-ChildItem build/papyrus/Scripts

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Package
        run: >
          python tools/package.py
          --dll build/release/RelWithDebInfo/LostObjects.dll
          --pdb build/release/RelWithDebInfo/LostObjects.pdb
          --scripts build/papyrus/Scripts
          --out dist

      - name: Upload mod archive
        uses: actions/upload-artifact@v6
        with:
          name: LostObjects-zip
          path: dist/LostObjects-*[0-9].zip
          if-no-files-found: error

      - name: Upload debug symbols
        uses: actions/upload-artifact@v6
        with:
          name: LostObjects-pdb
          path: dist/LostObjects-*-pdb.zip
          if-no-files-found: warn

      - name: Store mod archive in the repository (releases folder)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force releases | Out-Null
          Get-ChildItem releases -Filter "LostObjects-*.zip" | Remove-Item
          Get-ChildItem dist -Filter "LostObjects-*.zip" |
            Where-Object { $_.Name -notlike "*-pdb.zip" } |
            Copy-Item -Destination releases
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A releases
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update mod archive in releases/ [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          } else {
            Write-Host "releases/ is already up to date"
          }

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LostObjects-*.zip
          generate_release_notes: true
