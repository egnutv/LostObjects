; =============================================================================
;  Lost Objects - settings
;  Vibecoded by AI (Claude, Anthropic). AI-generated code can contain mistakes.
;
;  0 = off, 1 = on. Changes take effect the next time you start the game.
;  Full explanation: docs/CONFIGURATION.md in the GitHub repository.
; =============================================================================

[General]

; Master switch. 0 turns the mod off completely (nothing is scanned or changed).
bEnabled=1

; How the "Lost Objects" tab is organised:
;   ByMod = one folder per plugin file (mod, DLC or base game), the recovered
;           menus inside (recommended)
;   Flat  = all recovered menus directly in the tab
sSortMode=ByMod

; Show a short message the first time you enter workshop mode after loading
; a save, telling you how many items were recovered.
bShowSummaryMessage=1

; Give the tab and its folders the icon of the vanilla "Decorations" menu.
; Set to 0 if the icon looks wrong.
bBorrowMenuIcon=1

; Write a readable list of everything that was recovered to
; Documents\My Games\Fallout4\F4SE\LostObjects_Report.txt
bWriteReport=1

; Write every single recovered recipe to LostObjects.log (for bug reports).
bVerboseLog=0

[Filters]

; By default the tab shows EVERYTHING that has a workshop recipe and cannot be
; reached in the build menu. These filters are all off by default.

; 1 = hide vanilla and DLC recipes that no mod changed. The base game hides a
;     few recipes on purpose.
bSkipUntouchedBaseGame=0

; 1 = hide recipes that have no named category. Many mods create such recipes
;     only to define scrap results (often hundreds of buildings, trees and
;     clutter).
bSkipWithoutCategory=0

; Comma separated list of plugin files whose recipes should never be shown in
; the tab, for example:  sIgnorePlugins=SomeMod.esp, AnotherMod.esl
sIgnorePlugins=
