; =============================================================================
;  Lost Objects - settings
;  Vibecoded by AI (Claude, Anthropic). AI-generated code can contain mistakes.
;
;  0 = off, 1 = on. Changes take effect the next time you start the game.
;  Full explanation: docs/CONFIGURATION.md in the GitHub repository.
;
;  The everyday options are also on the settings holotape in your inventory.
;  Choices made there are saved in Documents\My Games\Fallout4\F4SE\
;  LostObjects_Settings.ini and win over the values in this file.
; =============================================================================

[General]

; Master switch. 0 turns the mod off completely (nothing is scanned or changed).
bEnabled=1

; Lost Objects checks the workshop menu again and again (after loading and
; every time you enter workshop mode) and updates its menus whenever something
; new turns up. Right after loading, while other mods are still adding their
; menus, a change must be seen twice in a row before the menus change.
; 1 = do not wait for the second scan (only for testing)
bLiveUpdate=0

; Earliest moment (seconds after loading) to build the menus. Other mods add
; their menus a few seconds after loading; two scans in a row must also agree.
iSettleSeconds=10

; Put lost categories and menus back exactly where their mod had them. Lost
; Objects reads the menus of every plugin file in your load order and knows
; where each category was before another mod changed that menu. (recommended)
; 0 = do not use the plugin files, only the placement below.
bRestoreOriginalPlaces=1

; Merge menus of a mod that have the same name and similar items, when the upper
; one lies directly in a menu on the path of the deeper one (for example
; "Greenhouse" and "Real Estate > Yard > Greenhouse" of the same mod; never between
; neighbouring branches like "Concrete > Supports" and "Wood > Supports").
; Everything goes into the upper menu. Similar means
; at least one model file or model folder in common; menus of different mods are
; never merged. (recommended) 0 = leave the menus of other mods as they are.
bMergeSimilarMenus=1

; Where the other recovered items go (those that never had a place in a menu):
;   Home = into an existing category that fits (see bSortIntoCategories),
;          otherwise into a "Lost Objects" folder inside the mod's own menu.
;          Only what has no home goes into the "Lost Objects" tab. (recommended)
;   Tab  = everything into the "Lost Objects" tab, other menus stay untouched
sPlacement=Home

; 1 = leave the menus of other mods untouched. Nothing is put back where its mod
;     had it, nothing is sorted into categories of other mods, no "Lost Objects"
;     folders are added to their menus and no menus are merged. Everything Lost
;     Objects thinks is lost goes into the "Lost Objects" tab of the main menu,
;     one folder per mod. Also on the settings holotape.
bOnlyOwnTab=0

; Sort recovered items into the existing category they belong to, found by
; comparing them with what is already in the menu (model folder, name, words).
; 0 = always use the "Lost Objects" folder of the mod instead.
bSortIntoCategories=1

; How sure (percent) the match into an existing category must be. Higher =
; fewer items sorted in, but fewer mistakes.
iMinConfidence=30

; How the "Lost Objects" tab is organised:
;   ByMod = one folder per plugin file (mod, DLC or base game), the recovered
;           menus inside (recommended)
;   Flat  = all recovered menus directly in the tab
sSortMode=ByMod

; Show a short message the first time you enter workshop mode after loading
; a save, telling you how many items were recovered.
bShowSummaryMessage=1

; Give the tab and the "Lost Objects" folders an icon in the workshop menu.
; Set to 0 if the icon looks wrong.
bBorrowMenuIcon=1

; 1 = the Lost Objects icon (the logo, from
;     Meshes\LostObjects\MenuIcon.nif). 0 = the icon of the vanilla
;     "Decorations" menu.
bCustomMenuIcon=1

; Write a readable list of everything that was recovered to
; Documents\My Games\Fallout4\F4SE\LostObjects_Report.txt
bWriteReport=1

; Development mode (for testers and for improving the sorting): also writes
; LostObjects_Inventory.tsv (every recovered item with name, model path, size,
; categories, components and why it was put where it is), LostObjects_Patterns.txt
; (frequency statistics), LostObjects_Menu.tsv (the complete workshop menu, several
; MB) and LostObjects_Duplicates.txt (everything that appears twice), all in
; Documents\My Games\Fallout4\F4SE. 0 for normal play.
bDevelopmentMode=0

; Write every single recovered recipe to LostObjects.log (for bug reports).
bVerboseLog=0

[Grouping]

; Categories with more items than this are split into groups automatically,
; based on what the items have in common (tags like "[Alcohol]", words in the
; names, model folders). No fixed word lists.
iSplitThreshold=40

; Maximum number of groups per split (including "Other").
iMaxGroups=40

; A group needs at least this many items.
iMinGroupSize=3

[Filters]

; By default Lost Objects shows EVERYTHING that has a workshop recipe and cannot
; be reached in the build menu.

; 1 = skip lost recipes whose item can already be built through another recipe
;     (for example "scrap return" recipes of decoration mods). They would only
;     show the same item twice. (recommended)
bSkipAlreadyBuildable=1

; 1 = hide "ghost objects": items whose model file does not exist (the build
;     menu would only show an empty slot). Checked through the game's own file
;     system (loose files and .ba2 archives). Items without a model by nature,
;     such as NPCs from spawner mods, are never hidden. (recommended)
bSkipMissingModels=1

; 1 = hide vanilla and DLC recipes that no mod changed. The base game hides a
;     few recipes on purpose.
bSkipUntouchedBaseGame=0

; 1 = hide recipes that have no named category. Many mods create such recipes
;     only to define scrap results (often hundreds of buildings, trees and
;     clutter).
bSkipWithoutCategory=0

; Comma separated list of plugin files whose recipes should never be shown in
; the tab, for example:  sIgnorePlugins=SomeMod.esp, AnotherMod.esl
sIgnorePlugins=
